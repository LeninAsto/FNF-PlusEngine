name: Docs

on:
  push:
    branches: [web-page]
  pull_request:
    paths:
      - '.github/workflows/docs.yml'
      - '.node-version'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - 'docs/**'
      - 'scripts/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v7
        if: success() && github.event_name == 'pull_request'
        with:
          name: docs-site
          path: docs
          if-no-files-found: error
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/web-page' && github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/web-page' && github.event_name != 'pull_request'
        with:
          path: docs

  deploy:
    if: github.ref == 'refs/heads/web-page' && github.event_name != 'pull_request'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
