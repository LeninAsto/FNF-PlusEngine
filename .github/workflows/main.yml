  summary:
    name: Workflow Summary
    runs-on: ubuntu-24.04
    needs:
      - check_platforms
      - build_linux_x64
      - build_linux_wayland
      - build_android
      - build_windows_x64
      - build_macos_arm64
      - build_macos_intel
      - build_ios
    if: always()
    outputs:
      complete: ${{ steps.results.outputs.complete }}
    steps:
      - name: Build tree summary
        id: results
        env:
          BUILD_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ['BUILD_RESULTS'])
          selection = needs['check_platforms']
          outputs = selection.get('outputs', {})
          groups = [
              ('Ubuntu', [('build_linux_x64', 'build_linux', 'Linux x64'), ('build_linux_wayland', 'build_wayland', 'Linux Wayland x64'), ('build_android', 'build_android', 'Android')]),
              ('Windows', [('build_windows_x64', 'build_windows', 'Windows x64')]),
              ('macOS', [('build_macos_arm64', 'build_macos_arm64', 'macOS ARM64'), ('build_macos_intel', 'build_macos_intel', 'macOS Intel'), ('build_ios', 'build_ios', 'iOS')]),
          ]
          icons = {'success': '[ok]', 'failure': '[fail]', 'cancelled': '[stop]', 'abandoned': '[runner]', 'skipped': '[skip]'}
          lines = ['## Build results', '', '```text', 'Build']
          failed = [] if selection['result'] == 'success' else ['Platform selection']
          infrastructure = []
          selected = 0
          succeeded = 0
          total = sum(len(jobs) for _, jobs in groups)
          for group_index, (group, jobs) in enumerate(groups):
              last_group = group_index == len(groups) - 1
              lines.append(f'{"`--" if last_group else "|--"} {group}')
              for index, (job_id, flag, label) in enumerate(jobs):
                  result = needs[job_id]['result']
                  enabled = outputs.get(flag) == 'true'
                  selected += int(enabled)
                  succeeded += int(result == 'success')
                  prefix = '    ' if last_group else '|   '
                  branch = '`--' if index == len(jobs) - 1 else '|--'
                  lines.append(f'{prefix}{branch} {label}: {icons.get(result, "[?]")} {result}')
                  if result == 'abandoned':
                      infrastructure.append(label)
                  if (enabled and result != 'success') or (not enabled and result != 'skipped'):
                      failed.append(label)
          if selected == 0:
              failed.append('No build targets selected')
          lines += ['```', '', f'Successful targets: {succeeded}/{selected} selected.']
          if failed:
              lines += ['', 'Errors: ' + ', '.join(failed)]
          if infrastructure:
              lines += ['', 'Runner allocation interrupted: ' + ', '.join(infrastructure)]
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as handle:
              handle.write('\n'.join(lines) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f'complete={str(not failed and succeeded == total).lower()}\n')
          if failed:
              sys.exit(1)
          PY

  publish_dev_build:
    name: Publish Dev Build
    runs-on: ubuntu-24.04
    concurrency:
      group: dev-build-release
      cancel-in-progress: false
    outputs:
      published: ${{ steps.publish.outputs.published }}
    needs:
      - check_platforms
      - summary
    if: |
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/dev' &&
      needs.check_platforms.outputs.publish_all == 'true' &&
      needs.summary.result == 'success' &&
      needs.summary.outputs.complete == 'true'

    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: "*-artifact"
          path: release-assets
          merge-multiple: true

      - name: Publish prerelease
        id: publish
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ env.DEV_BUILD_TAG }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const tag = process.env.RELEASE_TAG;
            const buildDate = new Date().toISOString().slice(0, 10);
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            async function deleteExistingReleaseAndTag() {
              try {
                const existing = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
                await github.rest.repos.deleteRelease({
                  owner,
                  repo,
                  release_id: existing.data.id,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }

              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `tags/${tag}`,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            function collectFiles(dir) {
              const entries = [];
              if (!fs.existsSync(dir)) return entries;

              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const fullPath = path.join(dir, entry.name);
                if (entry.isDirectory()) {
                  entries.push(...collectFiles(fullPath));
                } else {
                  entries.push(fullPath);
                }
              }

              return entries;
            }

            function contentTypeFor(filePath) {
              const lower = filePath.toLowerCase();
              if (lower.endsWith('.zip'))
                return 'application/zip';
              if (lower.endsWith('.apk'))
                return 'application/vnd.android.package-archive';
              if (lower.endsWith('.tar.gz'))
                return 'application/gzip';
              return 'application/octet-stream';
            }

            const commit = await github.rest.repos.getCommit({ owner, repo, ref: context.sha });
            const commitMessage = commit.data.commit.message.trim();
            const quotedMessage = commitMessage.split(/\r?\n/).map(line => `> ${line}`).join('\n');
            const commitUrl = `${context.serverUrl}/${owner}/${repo}/commit/${context.sha}`;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            const files = collectFiles('release-assets');
            const expected = [
              'FNF-PlusEngine-linux-x64.tar.gz',
              'FNF-PlusEngine-linux-wayland-x64.tar.gz',
              'FNF-PlusEngine-android.apk',
              'FNF-PlusEngine-windows-x64.zip',
              'FNF-PlusEngine-macos-arm64.zip',
              'FNF-PlusEngine-macos-intel.zip',
              'FNF-PlusEngine-ios.zip',
            ];
            const names = files.map(file => path.basename(file));
            if (names.length !== expected.length || !expected.every(name => names.includes(name)) ||
                files.some(file => fs.statSync(file).size === 0)) {
              throw new Error(`Incomplete or invalid release assets: ${names.join(', ')}`);
            }

            const head = await github.rest.git.getRef({ owner, repo, ref: 'heads/dev' });
            if (head.data.object.sha !== context.sha) {
              core.notice('A newer dev commit exists; keeping the current release.');
              core.setOutput('published', 'false');
              return;
            }

            await deleteExistingReleaseAndTag();

            const release = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: `devbuild ${buildDate}`,
              body: [
                '## Latest commit',
                '',
                quotedMessage || '> No commit message available.',
                '',
                `**Commit:** [\`${context.sha.slice(0, 7)}\`](${commitUrl})`,
                `**Branch:** \`${context.ref.replace('refs/heads/', '')}\``,
                `**Build:** [#${context.runNumber}](${runUrl})`,
                '',
                'Development builds may contain unfinished changes.',
              ].join('\n'),
              prerelease: true,
              draft: true,
            });

            for (const filePath of files) {
              const assetName = path.basename(filePath);
              const data = fs.readFileSync(filePath);
              await github.rest.repos.uploadReleaseAsset({
                owner,
                repo,
                release_id: release.data.id,
                name: assetName,
                data,
                headers: {
                  'content-type': contentTypeFor(filePath),
                  'content-length': data.length,
                },
              });
            }

            const published = await github.rest.repos.updateRelease({
              owner, repo, release_id: release.data.id, draft: false, prerelease: true,
            });
            if (published.data.draft || !published.data.prerelease) {
              throw new Error('The dev release was not published as a prerelease.');
            }
            core.setOutput('published', 'true');
            core.info(`Published prerelease: ${published.data.html_url}`);

  notify_discord:
    name: Notify Discord
    runs-on: ubuntu-24.04
    needs:
      - summary
      - publish_dev_build
    if: always() && github.event_name != 'pull_request'

    steps:
      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          SUMMARY_RESULT: ${{ needs.summary.result }}
          PUBLISH_RESULT: ${{ needs.publish_dev_build.result }}
          PUBLISHED: ${{ needs.publish_dev_build.outputs.published }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          SERVER_URL: ${{ github.server_url }}
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          APP_VERSION: ${{ env.APP_VERSION }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK is not configured, skipping notification."
            exit 0
          fi

          RUN_URL="$SERVER_URL/$REPOSITORY/actions/runs/$RUN_ID"
          RELEASE_URL="$SERVER_URL/$REPOSITORY/releases/tag/$DEV_BUILD_TAG"
          SHORT_SHA="${SHA::7}"
          TIMESTAMP_UTC="$(date -u +"%Y-%m-%d %H:%M UTC")"
          TIMESTAMP_ISO="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

          if [ "$SUMMARY_RESULT" = "success" ]; then
            STATUS="SUCCESS"
            COLOR=5763719
            if [ "$PUBLISH_RESULT" = "failure" ] || [ "$PUBLISH_RESULT" = "cancelled" ] || [ "$PUBLISH_RESULT" = "abandoned" ]; then
              STATUS="PUBLISH FAILED"
              COLOR=15548997
              DOWNLOAD_LABEL="Artifacts"
              DOWNLOAD_URL="$RUN_URL"
              DESCRIPTION="The builds succeeded, but publishing the dev release did not complete."
            elif [ "$PUBLISHED" = "true" ]; then
              DOWNLOAD_LABEL="Release"
              DOWNLOAD_URL="$RELEASE_URL"
              DESCRIPTION="The workflow completed successfully and the latest dev build is ready to download."
            else
              DOWNLOAD_LABEL="Artifacts"
              DOWNLOAD_URL="$RUN_URL"
              DESCRIPTION="The workflow completed successfully. The build files are available in this run's artifacts."
            fi
          else
            STATUS="FAILED"
            COLOR=15548997
            DOWNLOAD_LABEL="Workflow Run"
            DOWNLOAD_URL="$RUN_URL"
            DESCRIPTION="The workflow finished with errors. Check the run logs for details."
          fi

          export STATUS COLOR DOWNLOAD_LABEL DOWNLOAD_URL DESCRIPTION TIMESTAMP_UTC TIMESTAMP_ISO

          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          webhook = os.environ["DISCORD_WEBHOOK"]
          repo = os.environ["REPOSITORY"]
          branch = os.environ["REF_NAME"]
          short_sha = os.environ["SHA"][:7]
          run_id = os.environ["RUN_ID"]
          run_number = os.environ["RUN_NUMBER"]
          actor = os.environ["ACTOR"]
          event_name = os.environ["EVENT_NAME"]
          app_version = os.environ["APP_VERSION"]
          run_url = f'{os.environ["SERVER_URL"]}/{repo}/actions/runs/{run_id}'

          payload = {
              "embeds": [
                  {
                      "title": f'Build Workflow {os.environ["STATUS"]}',
                      "description": (
                          f'{os.environ["DESCRIPTION"]}\n\n'
                          f'[{os.environ["DOWNLOAD_LABEL"]}]({os.environ["DOWNLOAD_URL"]})'
                      ),
                      "color": int(os.environ["COLOR"]),
                      "timestamp": os.environ["TIMESTAMP_ISO"],
                      "fields": [
                          {"name": "Repository", "value": repo, "inline": True},
                          {"name": "Branch", "value": branch, "inline": True},
                          {"name": "Commit", "value": f'`{short_sha}`', "inline": True},
                          {"name": "Run", "value": f'#{run_number}', "inline": True},
                          {"name": "Triggered by", "value": actor, "inline": True},
                          {"name": "Event", "value": event_name, "inline": True},
                          {"name": "App Version", "value": f'`{app_version}`', "inline": False},
                          {"name": "Completed At", "value": os.environ["TIMESTAMP_UTC"], "inline": False},
                          {"name": "Workflow Logs", "value": run_url, "inline": False},
                      ],
                  }
              ]
          }

          data = json.dumps(payload).encode("utf-8")
          req = urllib.request.Request(
              webhook,
              data=data,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "GitHub-Actions-Discord-Notifier",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=20) as resp:
                  print(f"Discord webhook response: {resp.status}")
          except urllib.error.HTTPError as err:
              body = err.read().decode("utf-8", errors="replace")
              print(f"Discord webhook HTTP error: {err.code} {err.reason}")
              if body:
                  print(body)
              print("Continuing without failing the workflow.")
              sys.exit(0)
          except Exception as err:
              print(f"Discord webhook unexpected error: {err}")
              print("Continuing without failing the workflow.")
              sys.exit(0)
          PY
