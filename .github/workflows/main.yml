name: Build

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_VERSION: 4.0.0-${{ github.run_id }}
  HAXE_VERSION: 4.3.7
  SSCRIPT_SETTINGS: oy9:showMacroty8:loopCosti25y10:includeAllfg

jobs:
  build_linux_x64:
    name: Build Linux x64
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - name: Setup Haxe
        run: |
          sudo add-apt-repository ppa:haxe/releases -y
          sudo apt-get update
          sudo apt-get install -y haxe libvlc-dev libvlccore-dev
          haxe --version

      - name: Install libraries
        run: |
          chmod +x ./setup/unish-lib.sh
          ./setup/unish-lib.sh

      - name: Prepare build
        run: |
          printf '%s' "$SSCRIPT_SETTINGS" > ~/settings.cocoa
          printf '%s\n' "${{ github.run_id }}" > VERSION

      - name: Build
        run: haxelib run lime build linux --app-version="${APP_VERSION}" -D officialBuild

      - name: Package artifact
        run: |
          mkdir -p dist
          tar -C export/release/linux/bin -czf dist/FNF-PlusEngine-linux-x64.tar.gz .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-artifact
          path: dist/FNF-PlusEngine-linux-x64.tar.gz
          if-no-files-found: error

  build_android:
    name: Build Android
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - name: Setup Haxe
        run: |
          sudo add-apt-repository ppa:haxe/releases -y
          sudo apt-get update
          sudo apt-get install -y haxe
          haxe --version

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android packages
        run: |
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmdline-tools;latest" \
            "ndk;27.2.12479018"
          {
            echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018"
            echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          } >> "$GITHUB_ENV"

      - name: Install libraries
        run: |
          chmod +x ./setup/unish-lib.sh
          ./setup/unish-lib.sh

      - name: Configure Lime
        run: |
          haxelib run lime setup android
          haxelib run lime config ANDROID_SDK "$ANDROID_SDK_ROOT"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"

      - name: Prepare build
        run: |
          printf '%s' "$SSCRIPT_SETTINGS" > ~/settings.cocoa
          printf '%s\n' "${{ github.run_id }}" > VERSION
          rm -rf export build ~/.gradle

      - name: Build
        run: haxelib run lime build android --app-version="${APP_VERSION}" -D officialBuild -D HXCPP_IGNORE_WARNINGS

      - name: Package artifact
        run: |
          mkdir -p dist
          apk_path="$(find export/release/android/bin -type f -name '*.apk' | head -n 1)"
          test -n "$apk_path"
          cp "$apk_path" dist/FNF-PlusEngine-android.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-artifact
          path: dist/FNF-PlusEngine-android.apk
          if-no-files-found: error

  build_windows_x64:
    name: Build Windows x64
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v5

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7

      - name: Install libraries
        run: |
          haxelib setup C:\haxelib
          cmd /c setup\windows-lib.bat

      - name: Prepare build
        run: |
          Set-Content -Path "$env:USERPROFILE\settings.cocoa" -Value $env:SSCRIPT_SETTINGS -NoNewline
          Set-Content -Path VERSION -Value "${{ github.run_id }}"

      - name: Build
        run: haxelib run lime build windows --app-version="${env:APP_VERSION}" -D officialBuild

      - name: Package artifact
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path export/release/windows/bin/* -DestinationPath dist/FNF-PlusEngine-windows-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-artifact
          path: dist/FNF-PlusEngine-windows-x64.zip
          if-no-files-found: error

  build_macos_arm64:
    name: Build macOS ARM64
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v5

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7

      - name: Install libraries
        run: |
          chmod +x ./setup/unish-lib.sh
          ./setup/unish-lib.sh

      - name: Prepare build
        run: |
          printf '%s' "$SSCRIPT_SETTINGS" > ~/settings.cocoa
          printf '%s\n' "${{ github.run_id }}" > VERSION

      - name: Build
        run: haxelib run lime build mac --app-version="${APP_VERSION}" -D officialBuild

      - name: Package artifact
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent export/release/macos/bin dist/FNF-PlusEngine-macos-arm64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-artifact
          path: dist/FNF-PlusEngine-macos-arm64.zip
          if-no-files-found: error

  build_macos_intel:
    name: Build macOS Intel
    runs-on: macos-15-intel

    steps:
      - uses: actions/checkout@v5

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7

      - name: Install libraries
        run: |
          chmod +x ./setup/unish-lib.sh
          ./setup/unish-lib.sh

      - name: Prepare build
        run: |
          printf '%s' "$SSCRIPT_SETTINGS" > ~/settings.cocoa
          printf '%s\n' "${{ github.run_id }}" > VERSION

      - name: Build
        run: haxelib run lime build mac --app-version="${APP_VERSION}" -D officialBuild

      - name: Package artifact
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent export/release/macos/bin dist/FNF-PlusEngine-macos-intel.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-intel-artifact
          path: dist/FNF-PlusEngine-macos-intel.zip
          if-no-files-found: error

  build_ios:
    name: Build iOS
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v5

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7

      - name: Install libraries
        run: |
          chmod +x ./setup/unish-lib.sh
          ./setup/unish-lib.sh

      - name: Prepare build
        run: |
          printf '%s' "$SSCRIPT_SETTINGS" > ~/settings.cocoa
          printf '%s\n' "${{ github.run_id }}" > VERSION

      - name: Build
        run: haxelib run lime build ios -nosign --app-version="${APP_VERSION}" -D officialBuild

      - name: Package artifact
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent export/release/ios/build/Release-iphoneos dist/FNF-PlusEngine-ios.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-artifact
          path: dist/FNF-PlusEngine-ios.zip
          if-no-files-found: error

  scan_artifacts:
    name: VirusTotal Scan
    runs-on: ubuntu-24.04
    needs:
      - build_linux_x64
      - build_android
      - build_windows_x64
      - build_macos_arm64
      - build_macos_intel
      - build_ios
    if: always() && !cancelled()

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: vt-artifacts
          pattern: "*-artifact"
          merge-multiple: true

      - name: Scan files
        env:
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import time
          import urllib.request

          root = "vt-artifacts"
          summary_path = os.environ["GITHUB_STEP_SUMMARY"]
          api_key = os.environ.get("VT_API_KEY", "").strip()
          files = []
          for current_root, _, names in os.walk(root):
              for name in names:
                  files.append(os.path.join(current_root, name))
          files.sort()

          with open(summary_path, "a", encoding="utf-8") as handle:
              handle.write("## VirusTotal\n")
              if not files:
                  handle.write("- No se encontraron artefactos para escanear.\n")
                  raise SystemExit(1)
              if not api_key:
                  handle.write("- `VIRUSTOTAL_API_KEY` no esta configurada; el escaneo queda omitido.\n")
                  raise SystemExit(0)

          def request_json(url, method="GET", data=None, headers=None):
              req = urllib.request.Request(url, data=data, method=method)
              for key, value in (headers or {}).items():
                  req.add_header(key, value)
              with urllib.request.urlopen(req, timeout=120) as response:
                  return json.loads(response.read().decode("utf-8"))

          results = []
          blocked = []

          for path in files:
              size = os.path.getsize(path)
              upload_url = "https://www.virustotal.com/api/v3/files"
              headers = {"x-apikey": api_key}
              if size > 32 * 1024 * 1024:
                  upload_url = request_json(
                      "https://www.virustotal.com/api/v3/files/upload_url",
                      headers=headers,
                  )["data"]

              command = [
                  "curl",
                  "--silent",
                  "--show-error",
                  "--fail",
                  "--request",
                  "POST",
                  "--header",
                  f"x-apikey: {api_key}",
                  "--form",
                  f"file=@{path}",
                  upload_url,
              ]
              response = subprocess.run(command, capture_output=True, text=True, check=True)
              analysis_id = json.loads(response.stdout)["data"]["id"]

              status = "queued"
              stats = {}
              for _ in range(30):
                  analysis = request_json(
                      f"https://www.virustotal.com/api/v3/analyses/{analysis_id}",
                      headers=headers,
                  )["data"]["attributes"]
                  status = analysis.get("status", "unknown")
                  stats = analysis.get("stats", {})
                  if status == "completed":
                      break
                  time.sleep(15)
              else:
                  blocked.append(f"{os.path.basename(path)} (timeout)")
                  continue

              malicious = int(stats.get("malicious", 0))
              suspicious = int(stats.get("suspicious", 0))
              harmless = int(stats.get("harmless", 0))
              undetected = int(stats.get("undetected", 0))
              results.append(
                  {
                      "name": os.path.basename(path),
                      "status": "failed" if (malicious or suspicious) else "passed",
                      "malicious": malicious,
                      "suspicious": suspicious,
                      "harmless": harmless,
                      "undetected": undetected,
                      "url": f"https://www.virustotal.com/gui/file-analysis/{analysis_id}",
                  }
              )
              if malicious or suspicious:
                  blocked.append(os.path.basename(path))

          with open(summary_path, "a", encoding="utf-8") as handle:
              handle.write("| Archivo | Estado | Malicious | Suspicious | Harmless | Undetected |\n")
              handle.write("| --- | --- | ---: | ---: | ---: | ---: |\n")
              for item in results:
                  handle.write(
                      f"| [{item['name']}]({item['url']}) | {item['status']} | {item['malicious']} | {item['suspicious']} | {item['harmless']} | {item['undetected']} |\n"
                  )
              if blocked:
                  handle.write(f"\n- Archivos con senales raras: {', '.join(blocked)}\n")

          if blocked:
              raise SystemExit(1)
          PY

  summary:
    name: Workflow Summary
    runs-on: ubuntu-24.04
    needs:
      - build_linux_x64
      - build_android
      - build_windows_x64
      - build_macos_arm64
      - build_macos_intel
      - build_ios
      - scan_artifacts
    if: always()

    steps:
      - name: Build tree summary
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(r'''${{ toJson(needs) }}''')
          order = [
              ("build_linux_x64", "Linux x64"),
              ("build_android", "Android"),
              ("build_windows_x64", "Windows x64"),
              ("build_macos_arm64", "macOS ARM64"),
              ("build_macos_intel", "macOS Intel"),
              ("build_ios", "iOS"),
              ("scan_artifacts", "VirusTotal"),
          ]
          icons = {
              "success": "[ok]",
              "failure": "[fail]",
              "cancelled": "[stop]",
              "skipped": "[skip]",
          }

          lines = ["## Resumen", "", "```text", "workflow"]
          failed = []

          for index, (job_id, label) in enumerate(order):
              result = needs[job_id]["result"]
              icon = icons.get(result, "[?]")
              branch = "`--" if index == len(order) - 1 else "|--"
              lines.append(f"{branch} {label}: {icon} {result}")
              if result not in ("success", "skipped"):
                  failed.append(label)

          lines.append("```")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")

          if failed:
              sys.exit(1)
          PY
