name: Build

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      build_linux:
        description: "Build Linux x64"
        type: boolean
        default: true
      build_wayland:
        description: "Build Linux x64 with native Wayland"
        type: boolean
        default: true
      build_android:
        description: "Build Android"
        type: boolean
        default: true
      build_windows:
        description: "Build Windows x64"
        type: boolean
        default: true
      build_macos_arm64:
        description: "Build macOS ARM64"
        type: boolean
        default: true
      build_macos_intel:
        description: "Build macOS Intel"
        type: boolean
        default: true
      build_ios:
        description: "Build iOS"
        type: boolean
        default: true
      apple_runner:
        description: "ARM64 macOS runner for macOS and iOS"
        type: choice
        default: macos-15
        options:
          - macos-15
          - macos-26
      publish_all:
        description: "Publish complete dev prerelease (all targets required)"
        type: boolean
        default: true
      dev_build:
        description: "Show GitHub commit build info in-game"
        type: boolean
        default: true

permissions:
  contents: read

env:
  APP_VERSION: 4.0.0-${{ github.run_id }}
  HAXE_VERSION: 4.3.7
  DEV_BUILD_TAG: dev-build

jobs:
  check_platforms:
    name: Check Platforms
    runs-on: ubuntu-24.04
    outputs:
      build_linux: ${{ steps.set_outputs.outputs.build_linux }}
      build_wayland: ${{ steps.set_outputs.outputs.build_wayland }}
      build_android: ${{ steps.set_outputs.outputs.build_android }}
      build_windows: ${{ steps.set_outputs.outputs.build_windows }}
      build_macos_arm64: ${{ steps.set_outputs.outputs.build_macos_arm64 }}
      build_macos_intel: ${{ steps.set_outputs.outputs.build_macos_intel }}
      build_ios: ${{ steps.set_outputs.outputs.build_ios }}
      publish_all: ${{ steps.set_outputs.outputs.publish_all }}
      dev_build: ${{ steps.set_outputs.outputs.dev_build }}
    steps:
      - id: set_outputs
        run: |
          if [[ "${{ github.event_name }}" == "push" ]] || [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "build_linux=true" >> "$GITHUB_OUTPUT"
            echo "build_wayland=true" >> "$GITHUB_OUTPUT"
            echo "build_android=true" >> "$GITHUB_OUTPUT"
            echo "build_windows=true" >> "$GITHUB_OUTPUT"
            echo "build_macos_arm64=true" >> "$GITHUB_OUTPUT"
            echo "build_macos_intel=true" >> "$GITHUB_OUTPUT"
            echo "build_ios=true" >> "$GITHUB_OUTPUT"
            echo "publish_all=true" >> "$GITHUB_OUTPUT"
            if [[ "$GITHUB_REF_NAME" == "dev" || "$GITHUB_BASE_REF" == "dev" ]]; then
              echo "dev_build=true" >> "$GITHUB_OUTPUT"
            else
              echo "dev_build=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "build_linux=${{ inputs.build_linux }}" >> "$GITHUB_OUTPUT"
            echo "build_wayland=${{ inputs.build_wayland }}" >> "$GITHUB_OUTPUT"
            echo "build_android=${{ inputs.build_android }}" >> "$GITHUB_OUTPUT"
            echo "build_windows=${{ inputs.build_windows }}" >> "$GITHUB_OUTPUT"
            echo "build_macos_arm64=${{ inputs.build_macos_arm64 }}" >> "$GITHUB_OUTPUT"
            echo "build_macos_intel=${{ inputs.build_macos_intel }}" >> "$GITHUB_OUTPUT"
            echo "build_ios=${{ inputs.build_ios }}" >> "$GITHUB_OUTPUT"
            echo "publish_all=${{ inputs.publish_all }}" >> "$GITHUB_OUTPUT"
            echo "dev_build=${{ inputs.dev_build }}" >> "$GITHUB_OUTPUT"
          fi

  build_linux_x64:
    name: Build Linux x64
    runs-on: ubuntu-24.04
    needs: check_platforms
    if: needs.check_platforms.outputs.build_linux == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvlc-dev libvlccore-dev

      - name: Install libraries
        run: |
          chmod +x ./setup/unish-lib.sh
          ./setup/unish-lib.sh

      - name: Prepare build
        run: |
          printf '%s\n' "${{ github.run_id }}" > VERSION
          cat > source/backend/BuildInfoGenerated.hx <<'EOF'
          package backend;

          class BuildInfoGenerated
          {
          	public static inline final githubDevBuild:Bool = ${{ needs.check_platforms.outputs.dev_build == 'true' }};
          	public static inline final commit:String = "${{ github.sha }}";
          	public static inline final runId:String = "${{ github.run_id }}";
          }
          EOF

      - name: Build
        run: |
          haxelib run lime build Project.xml linux --app-version="${APP_VERSION}" -D officialBuild -release

      - name: Package artifact
        run: |
          mkdir -p dist
          build_root="export/release"
          if [ ! -d "$build_root" ]; then
            echo "::error::$build_root does not exist after Linux build"
            find export -maxdepth 4 -type d 2>/dev/null | sort || true
            exit 1
          fi
          out_dir="$(find "$build_root" -type d -path '*/linux/bin' -print -quit)"
          if [ -z "$out_dir" ]; then
            echo "::error::Linux output folder was not found under $build_root"
            find export -maxdepth 4 -type d | sort
            exit 1
          fi
          tar -C "$out_dir" -czf "dist/FNF-PlusEngine-linux-x64.tar.gz" .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-x64-artifact
          path: dist/FNF-PlusEngine-linux-x64.tar.gz
          if-no-files-found: error
          compression-level: 0

  build_linux_wayland:
    name: Build Linux Wayland x64
    runs-on: ubuntu-24.04
    needs: check_platforms
    if: needs.check_platforms.outputs.build_wayland == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvlc-dev libvlccore-dev libsdl2-dev patchelf weston libgl1-mesa-dev libglu1-mesa-dev libasound2-dev libx11-dev libxext-dev libxi-dev libxrandr-dev libxinerama-dev libpulse-dev libwayland-dev libxkbcommon-dev libgl1-mesa-dri

      - name: Install libraries
        run: |
          chmod +x ./setup/unish-lib.sh
          ./setup/unish-lib.sh

      - name: Rebuild Lime with SDL2 Wayland support
        run: |
          lime_root="$(haxelib config | sed -n '1{s/\r$//;p;}')/lime/git"
          test -f "$lime_root/project/Build.xml"
          stretch_dir="$lime_root/dependencies/signalsmith-stretch"
          if [ ! -f "$stretch_dir/signalsmith-stretch.h" ]; then
            mkdir -p "$stretch_dir"
            git -C "$stretch_dir" init
            if ! git -C "$stretch_dir" remote get-url origin >/dev/null 2>&1; then
              git -C "$stretch_dir" remote add origin https://github.com/Signalsmith-Audio/signalsmith-stretch.git
            fi
            stretch_revision="$(git -C "$lime_root" ls-tree HEAD dependencies/signalsmith-stretch | awk '{print $3}')"
            test -n "$stretch_revision"
            git -C "$stretch_dir" fetch --depth 1 origin "$stretch_revision"
            git -C "$stretch_dir" checkout --detach FETCH_HEAD
          fi
          test -f "$stretch_dir/signalsmith-stretch.h"
          python3 setup/enable-lime-wayland.py "$lime_root"
          (cd "$lime_root/project" && haxelib run hxcpp Build.xml -Dlinux -DHXCPP_M64 -DHXCPP_NO_CPP11 -Dplus_system_sdl)
          lime_ndll="$lime_root/ndll/Linux64/lime.ndll"
          ldd "$lime_ndll" | grep 'libSDL2-2.0.so.0'
          if ldd "$lime_ndll" | grep -q 'not found'; then
            echo "::error::Rebuilt Lime has unresolved native dependencies"
            exit 1
          fi
          echo "LIME_WAYLAND_NDLL=$lime_ndll" >> "$GITHUB_ENV"

      - name: Verify Wayland and OpenGL
        run: bash setup/test-lime-wayland.sh "$LIME_WAYLAND_NDLL"

      - name: Prepare build
        run: |
          printf '%s\n' "${{ github.run_id }}" > VERSION
          cat > source/backend/BuildInfoGenerated.hx <<'EOF'
          package backend;

          class BuildInfoGenerated
          {
          	public static inline final githubDevBuild:Bool = ${{ needs.check_platforms.outputs.dev_build == 'true' }};
          	public static inline final commit:String = "${{ github.sha }}";
          	public static inline final runId:String = "${{ github.run_id }}";
          }
          EOF

      - name: Build
        run: |
          haxelib run lime build Project.xml linux --app-version="${APP_VERSION}" -D officialBuild -release

      - name: Package artifact
        run: |
          mkdir -p dist
          build_root="export/release"
          if [ ! -d "$build_root" ]; then
            echo "::error::$build_root does not exist after Linux build"
            find export -maxdepth 4 -type d 2>/dev/null | sort || true
            exit 1
          fi
          out_dir="$(find "$build_root" -type d -path '*/linux/bin' -print -quit)"
          if [ -z "$out_dir" ]; then
            echo "::error::Linux output folder was not found under $build_root"
            find export -maxdepth 4 -type d | sort
            exit 1
          fi
          sdl_library="$(ldconfig -p | awk '/libSDL2-2.0.so.0 .*x86-64/ && !path {path=$NF} END {print path}')"
          test -n "$sdl_library"
          cp -L "$sdl_library" "$out_dir/libSDL2-2.0.so.0"
          cp /usr/share/doc/libsdl2-2.0-0/copyright "$out_dir/SDL2-LICENSE.txt"
          install -m 755 setup/launch-wayland.sh "$out_dir/PlusEngine-wayland.sh"
          patchelf --set-rpath '$ORIGIN' "$out_dir/lime.ndll"
          ldd "$(realpath "$out_dir/lime.ndll")" | grep -F "$(realpath "$out_dir")/libSDL2-2.0.so.0"
          bash setup/test-lime-wayland.sh "$out_dir/lime.ndll" "$out_dir/PlusEngine"
          tar -C "$out_dir" -czf "dist/FNF-PlusEngine-linux-wayland-x64.tar.gz" .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-wayland-x64-artifact
          path: dist/FNF-PlusEngine-linux-wayland-x64.tar.gz
          if-no-files-found: error
          compression-level: 0

  build_android:
    name: Build Android
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MAVEN_CENTRAL_MIRROR: https://maven-central.storage-download.googleapis.com/maven2/
      MAVEN_CENTRAL_ORIGINAL: https://repo.maven.apache.org/maven2/
    needs: check_platforms
    if: needs.check_platforms.outputs.build_android == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "21"

      - name: Setup Android SDK
        run: |
          # WARNING: Do not install the legacy "tools" package. Modern cmdline-tools removed it.
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          fi

          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo "::error::Android sdkmanager was not found under $SDK_ROOT"
            exit 1
          fi

          SDKMANAGER_DIR="$(dirname "$SDKMANAGER")"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.3.13750724"
          {
            echo "ANDROID_HOME=$SDK_ROOT"
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
            echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/27.3.13750724"
            echo "ANDROID_NDK_ROOT=$SDK_ROOT/ndk/27.3.13750724"
          } >> "$GITHUB_ENV"
          {
            echo "$SDKMANAGER_DIR"
            echo "$SDK_ROOT/platform-tools"
          } >> "$GITHUB_PATH"

      - name: Install libraries
        run: |
          chmod +x ./setup/unish-lib.sh
          ./setup/unish-lib.sh

      - name: Configure Maven Central mirror
        id: gradle_templates
        run: |
          lime_root="$(haxelib config | sed -n '1{s/\r$//;p;}')/lime/git"
          templates="$lime_root/templates/android"
          test -f "$templates/template/build.gradle.kts"
          echo "revision=$(git -C "$lime_root" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          python3 - "$templates" <<'PYTHON'
          import re
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          pattern = re.compile(r'(?m)^([ \t]*)mavenCentral\([ \t]*\)[ \t]*$')
          count = 0
          for path in sorted(root.rglob('*.gradle.kts')):
              original = path.read_text(encoding='utf-8')
              replacement = (
                  r'\1maven { url = uri(System.getenv("PLUS_MAVEN_CENTRAL_URL") '
                  r'?: "https://repo.maven.apache.org/maven2/") }'
              )
              patched, matches = pattern.subn(replacement, original)
              if matches:
                  path.write_text(patched, encoding='utf-8')
                  count += matches
                  print(f'{path.relative_to(root)}: {matches} Maven Central declarations')
          if not count:
              raise SystemExit('No Maven Central declarations found; inspect the Lime Android templates')
          PYTHON

      - name: Restore Gradle downloads
        id: gradle_cache
        uses: actions/cache/restore@v6
        continue-on-error: true
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: ${{ runner.os }}-plus-gradle-v2-${{ steps.gradle_templates.outputs.revision }}-${{ hashFiles('Project.xml', 'setup/unish-lib.sh') }}
          restore-keys: |
            ${{ runner.os }}-plus-gradle-v2-${{ steps.gradle_templates.outputs.revision }}-${{ hashFiles('Project.xml', 'setup/unish-lib.sh') }}-partial-
            ${{ runner.os }}-plus-gradle-v2-${{ steps.gradle_templates.outputs.revision }}-
            ${{ runner.os }}-plus-gradle-v2-

      - name: Configure Lime
        run: |
          haxelib run lime setup android
          haxelib run lime config ANDROID_SDK "$ANDROID_SDK_ROOT"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_SDK_ROOT/ndk/27.3.13750724"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"

      - name: Prepare build
        run: |
          printf '%s\n' "${{ github.run_id }}" > VERSION
          cat > source/backend/BuildInfoGenerated.hx <<'EOF'
          package backend;

          class BuildInfoGenerated
          {
          	public static inline final githubDevBuild:Bool = ${{ needs.check_platforms.outputs.dev_build == 'true' }};
          	public static inline final commit:String = "${{ github.sha }}";
          	public static inline final runId:String = "${{ github.run_id }}";
          }
          EOF
          rm -rf export build

      - name: Build
        id: android_build
        run: |
          set -o pipefail
          probe_path="org/jetbrains/kotlin/kotlin-gradle-plugin/2.1.0/kotlin-gradle-plugin-2.1.0.pom"
          probe() {
            curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 \
              --output /dev/null "${1}${probe_path}"
          }

          repository="$MAVEN_CENTRAL_MIRROR"
          if ! probe "$repository"; then
            if probe "$MAVEN_CENTRAL_ORIGINAL"; then
              repository="$MAVEN_CENTRAL_ORIGINAL"
            else
              echo "::warning::Both Maven Central probes failed; attempting the build with the mirror and existing cache"
            fi
          fi

          for attempt in 1 2 3; do
            echo "Android attempt $attempt/3; Maven Central: $repository"
            log="$RUNNER_TEMP/android-build-$attempt.log"
            if PLUS_MAVEN_CENTRAL_URL="$repository" haxelib run lime build Project.xml android \
              --app-version="${APP_VERSION}" -D officialBuild -release -DHXCPP_IGNORE_WARNINGS 2>&1 | tee "$log"; then
              echo "transient=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if grep -Eqi 'status code (429|502|503|504)|Too Many Requests|Service Unavailable|Read timed out|Connection timed out|Connection reset' "$log"; then
              echo "transient=true" >> "$GITHUB_OUTPUT"
            elif [[ "$repository" == "$MAVEN_CENTRAL_MIRROR" ]] && grep -Fq "$MAVEN_CENTRAL_MIRROR" "$log" && grep -Eq 'Could not find |Could not resolve ' "$log"; then
              echo "transient=true" >> "$GITHUB_OUTPUT"
            else
              echo "transient=false" >> "$GITHUB_OUTPUT"
              exit 1
            fi

            if [[ "$attempt" == 3 ]]; then
              echo "::error::Android dependency downloads failed after 3 attempts"
              exit 1
            fi
            echo "::warning::Temporary dependency download failure; retrying after backoff"
            sleep "$((60 * attempt + RANDOM % 21))"
            if [[ "$repository" == "$MAVEN_CENTRAL_MIRROR" ]]; then
              alternate="$MAVEN_CENTRAL_ORIGINAL"
            else
              alternate="$MAVEN_CENTRAL_MIRROR"
            fi
            if probe "$alternate"; then
              repository="$alternate"
            fi
          done

      - name: Check Gradle cache contents
        id: gradle_cache_ready
        if: ${{ !cancelled() && (steps.android_build.outcome == 'success' || steps.android_build.outputs.transient == 'true') }}
        run: |
          if [[ -d "$HOME/.gradle/caches/modules-2/files-2.1" ]] && \
             [[ -n "$(find "$HOME/.gradle/caches/modules-2/files-2.1" -type f -print -quit)" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save Gradle downloads
        if: ${{ !cancelled() && github.event_name != 'pull_request' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') && steps.gradle_cache_ready.outputs.ready == 'true' && steps.android_build.outcome == 'success' && steps.gradle_cache.outputs.cache-hit != 'true' && steps.gradle_cache.outputs.cache-primary-key != '' }}
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: ${{ steps.gradle_cache.outputs.cache-primary-key }}

      - name: Preserve partial Gradle downloads
        if: ${{ !cancelled() && github.event_name != 'pull_request' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') && steps.gradle_cache_ready.outputs.ready == 'true' && steps.android_build.outcome == 'failure' && steps.android_build.outputs.transient == 'true' && steps.gradle_cache.outputs.cache-primary-key != '' }}
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: ${{ steps.gradle_cache.outputs.cache-primary-key }}-partial-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload Android diagnostics
        if: ${{ !cancelled() && steps.android_build.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: android-build-logs
          path: ${{ runner.temp }}/android-build-*.log
          if-no-files-found: warn
          retention-days: 7

      - name: Package artifact
        run: |
          mkdir -p dist
          build_root="export/release"
          if [ ! -d "$build_root" ]; then
            echo "::error::$build_root does not exist after Android build"
            find export -maxdepth 6 -type d 2>/dev/null | sort || true
            exit 1
          fi
          mapfile -t apks < <(find "$build_root" -type f -name '*.apk' | sort)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::No Android APK found under $build_root"
            exit 1
          fi
          # Lime/Gradle may leave identical copies in different output directories.
          first_hash="$(sha256sum "${apks[0]}" | awk '{print $1}')"
          for apk in "${apks[@]}"; do
            if [ "$(sha256sum "$apk" | awk '{print $1}')" != "$first_hash" ]; then
              echo "::error::Multiple different APKs found; select the intended release explicitly"
              printf '%s\n' "${apks[@]}"
              exit 1
            fi
          done
          cp "${apks[0]}" "dist/FNF-PlusEngine-android.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-artifact
          path: dist/FNF-PlusEngine-android.apk
          if-no-files-found: error
          compression-level: 0

  build_windows_x64:
    name: Build Windows x64
    runs-on: windows-2025
    needs: check_platforms
    if: needs.check_platforms.outputs.build_windows == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Install libraries
        run: |
          haxelib setup C:\haxelib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c setup\windows-lib.bat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare build
        run: |
          Set-Content -Path VERSION -Value "${{ github.run_id }}" -Encoding utf8NoBOM
          @'
          package backend;

          class BuildInfoGenerated
          {
          	public static inline final githubDevBuild:Bool = ${{ needs.check_platforms.outputs.dev_build == 'true' }};
          	public static inline final commit:String = "${{ github.sha }}";
          	public static inline final runId:String = "${{ github.run_id }}";
          }
          '@ | Set-Content -Path source/backend/BuildInfoGenerated.hx -Encoding utf8NoBOM

      - name: Build
        run: |
          haxelib run lime build Project.xml windows --app-version="${env:APP_VERSION}" -D officialBuild -release

      - name: Package artifact
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $buildRoot = "export/release"
          $outDir = Get-ChildItem -Path $buildRoot -Directory -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -replace '\\','/' -match '/windows/bin$' } |
            Select-Object -First 1
          if ($null -eq $outDir) {
            Write-Error "Windows output folder was not found under $buildRoot"
            Get-ChildItem -Path export -Directory -Recurse -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
            exit 1
          }
          Compress-Archive -Path (Join-Path $outDir.FullName '*') -DestinationPath "dist/FNF-PlusEngine-windows-x64.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64-artifact
          path: dist/FNF-PlusEngine-windows-x64.zip
          if-no-files-found: error
          compression-level: 0

  build_macos_arm64:
    name: Build macOS ARM64
    runs-on: ${{ inputs.apple_runner || 'macos-15' }}
    needs: check_platforms
    if: needs.check_platforms.outputs.build_macos_arm64 == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Install libraries
        run: |
          chmod +x ./setup/unish-lib.sh
          ./setup/unish-lib.sh

      - name: Prepare build
        run: |
          printf '%s\n' "${{ github.run_id }}" > VERSION
          cat > source/backend/BuildInfoGenerated.hx <<'EOF'
          package backend;

          class BuildInfoGenerated
          {
          	public static inline final githubDevBuild:Bool = ${{ needs.check_platforms.outputs.dev_build == 'true' }};
          	public static inline final commit:String = "${{ github.sha }}";
          	public static inline final runId:String = "${{ github.run_id }}";
          }
          EOF

      - name: Build
        run: |
          haxelib run lime build Project.xml mac --app-version="${APP_VERSION}" -D officialBuild -release

      - name: Package artifact
        run: |
          mkdir -p dist
          build_root="export/release"
          out_dir="$(find "$build_root" -type d -path '*/macos/bin' -print -quit)"
          if [ -z "$out_dir" ]; then
            echo "::error::macOS ARM64 output folder was not found under $build_root"
            find export -maxdepth 5 -type d 2>/dev/null | sort || true
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$out_dir" "dist/FNF-PlusEngine-macos-arm64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64-artifact
          path: dist/FNF-PlusEngine-macos-arm64.zip
          if-no-files-found: error
          compression-level: 0

