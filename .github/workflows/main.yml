name: Build

on:
  push:
    branches: [main, dev, opt]
  pull_request:
    branches: [main, dev, opt]
  workflow_dispatch:
    inputs:
      build_linux:
        description: "Build Linux x64"
        type: boolean
        default: true
      build_wayland:
        description: "Build Linux x64 with native Wayland"
        type: boolean
        default: true
      build_android:
        description: "Build Android"
        type: boolean
        default: true
      build_windows:
        description: "Build Windows x64"
        type: boolean
        default: true
      build_macos_arm64:
        description: "Build macOS ARM64"
        type: boolean
        default: true
      build_macos_intel:
        description: "Build macOS Intel"
        type: boolean
        default: true
      build_ios:
        description: "Build iOS"
        type: boolean
        default: true
      publish_all:
        description: "Publish to all platforms (opt build)"
        type: boolean
        default: true
      opt_build:
        description: "Show GitHub commit build info in-game"
        type: boolean
        default: true

permissions:
  contents: read

env:
  APP_VERSION: 4.0.0-${{ github.run_id }}
  HAXE_VERSION: 4.3.7
  OPT_BUILD_TAG: opt-build

jobs:
  check_platforms:
    name: Check Platforms
    runs-on: ubuntu-24.04
    outputs:
      build_linux: ${{ steps.set_outputs.outputs.build_linux }}
      build_wayland: ${{ steps.set_outputs.outputs.build_wayland }}
      build_android: ${{ steps.set_outputs.outputs.build_android }}
      build_windows: ${{ steps.set_outputs.outputs.build_windows }}
      build_macos_arm64: ${{ steps.set_outputs.outputs.build_macos_arm64 }}
      build_macos_intel: ${{ steps.set_outputs.outputs.build_macos_intel }}
      build_ios: ${{ steps.set_outputs.outputs.build_ios }}
      publish_all: ${{ steps.set_outputs.outputs.publish_all }}
      opt_build: ${{ steps.set_outputs.outputs.opt_build }}
    steps:
      - id: set_outputs
        run: |
          if [[ "${{ github.event_name }}" == "push" ]] || [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "build_linux=true" >> $GITHUB_OUTPUT
            echo "build_wayland=true" >> $GITHUB_OUTPUT
            echo "build_android=true" >> $GITHUB_OUTPUT
            echo "build_windows=true" >> $GITHUB_OUTPUT
            echo "build_macos_arm64=true" >> $GITHUB_OUTPUT
            echo "build_macos_intel=true" >> $GITHUB_OUTPUT
            echo "build_ios=true" >> $GITHUB_OUTPUT
            echo "publish_all=true" >> $GITHUB_OUTPUT
            if [[ "${{ github.ref_name }}" == "opt" ]]; then
              echo "opt_build=true" >> $GITHUB_OUTPUT
            else
              echo "opt_build=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "build_linux=${{ github.event.inputs.build_linux }}" >> $GITHUB_OUTPUT
            echo "build_wayland=${{ github.event.inputs.build_wayland }}" >> $GITHUB_OUTPUT
            echo "build_android=${{ github.event.inputs.build_android }}" >> $GITHUB_OUTPUT
            echo "build_windows=${{ github.event.inputs.build_windows }}" >> $GITHUB_OUTPUT
            echo "build_macos_arm64=${{ github.event.inputs.build_macos_arm64 }}" >> $GITHUB_OUTPUT
            echo "build_macos_intel=${{ github.event.inputs.build_macos_intel }}" >> $GITHUB_OUTPUT
            echo "build_ios=${{ github.event.inputs.build_ios }}" >> $GITHUB_OUTPUT
            echo "publish_all=${{ github.event.inputs.publish_all }}" >> $GITHUB_OUTPUT
            echo "opt_build=${{ github.event.inputs.opt_build }}" >> $GITHUB_OUTPUT
          fi

  build_linux_x64:
    name: Ubuntu / Linux x64
    needs: check_platforms
    if: needs.check_platforms.outputs.build_linux == 'true'
    uses: ./.github/workflows/build-ubuntu.yml
    with:
      target: build_linux_x64
      opt_build: ${{ needs.check_platforms.outputs.opt_build == 'true' }}

  build_linux_wayland:
    name: Ubuntu / Linux Wayland x64
    needs: check_platforms
    if: needs.check_platforms.outputs.build_wayland == 'true'
    uses: ./.github/workflows/build-ubuntu.yml
    with:
      target: build_linux_wayland
      opt_build: ${{ needs.check_platforms.outputs.opt_build == 'true' }}

  build_android:
    name: Ubuntu / Android
    needs: check_platforms
    if: needs.check_platforms.outputs.build_android == 'true'
    uses: ./.github/workflows/build-ubuntu.yml
    with:
      target: build_android
      opt_build: ${{ needs.check_platforms.outputs.opt_build == 'true' }}

  build_windows_x64:
    name: Windows / x64
    needs: check_platforms
    if: needs.check_platforms.outputs.build_windows == 'true'
    uses: ./.github/workflows/build-windows.yml
    with:
      target: build_windows_x64
      opt_build: ${{ needs.check_platforms.outputs.opt_build == 'true' }}

  build_macos_arm64:
    name: macOS / ARM64
    needs: check_platforms
    if: needs.check_platforms.outputs.build_macos_arm64 == 'true'
    uses: ./.github/workflows/build-macos.yml
    with:
      target: build_macos_arm64
      opt_build: ${{ needs.check_platforms.outputs.opt_build == 'true' }}

  build_macos_intel:
    name: macOS / Intel
    needs: check_platforms
    if: needs.check_platforms.outputs.build_macos_intel == 'true'
    uses: ./.github/workflows/build-macos.yml
    with:
      target: build_macos_intel
      opt_build: ${{ needs.check_platforms.outputs.opt_build == 'true' }}

  build_ios:
    name: macOS / iOS
    needs: check_platforms
    if: needs.check_platforms.outputs.build_ios == 'true'
    uses: ./.github/workflows/build-macos.yml
    with:
      target: build_ios
      opt_build: ${{ needs.check_platforms.outputs.opt_build == 'true' }}

  summary:
    name: Workflow Summary
    needs:
      - check_platforms
      - build_linux_x64
      - build_linux_wayland
      - build_android
      - build_windows_x64
      - build_macos_arm64
      - build_macos_intel
      - build_ios
    if: always()
    uses: ./.github/workflows/build-summary.yml
    with:
      results: ${{ toJSON(needs) }}

  publish_opt_build:
    name: Publish Opt Build
    runs-on: ubuntu-24.04
    needs:
      - check_platforms
      - summary
    if: |
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/opt' &&
      needs.check_platforms.outputs.publish_all == 'true' &&
      needs.summary.result == 'success'

    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: "*"
          path: release-assets
          merge-multiple: true

      - name: Publish prerelease
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ env.OPT_BUILD_TAG }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const tag = process.env.RELEASE_TAG;
            const buildDate = new Date().toISOString().slice(0, 10);
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            async function deleteExistingReleaseAndTag() {
              try {
                const existing = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
                await github.rest.repos.deleteRelease({
                  owner,
                  repo,
                  release_id: existing.data.id,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }

              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `tags/${tag}`,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            function collectFiles(dir) {
              const entries = [];
              if (!fs.existsSync(dir)) return entries;

              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const fullPath = path.join(dir, entry.name);
                if (entry.isDirectory()) {
                  entries.push(...collectFiles(fullPath));
                } else {
                  entries.push(fullPath);
                }
              }

              return entries;
            }

            function contentTypeFor(filePath) {
              const lower = filePath.toLowerCase();
              if (lower.endsWith('.zip'))
                return 'application/zip';
              if (lower.endsWith('.apk'))
                return 'application/vnd.android.package-archive';
              if (lower.endsWith('.tar.gz'))
                return 'application/gzip';
              return 'application/octet-stream';
            }

            const commit = await github.rest.repos.getCommit({ owner, repo, ref: context.sha });
            const commitMessage = commit.data.commit.message.trim();
            const quotedMessage = commitMessage.split(/\r?\n/).map(line => `> ${line}`).join('\n');
            const commitUrl = `${context.serverUrl}/${owner}/${repo}/commit/${context.sha}`;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            await deleteExistingReleaseAndTag();

            const release = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: `optbuild ${buildDate}`,
              body: [
                '## Latest commit',
                '',
                quotedMessage || '> No commit message available.',
                '',
                `**Commit:** [\`${context.sha.slice(0, 7)}\`](${commitUrl})`,
                `**Branch:** \`${context.ref.replace('refs/heads/', '')}\``,
                `**Build:** [#${context.runNumber}](${runUrl})`,
                '',
                'Development builds may contain unfinished changes.',
              ].join('\n'),
              prerelease: true,
              draft: false,
            });

            const assetDirs = ['release-assets'];

            for (const dir of assetDirs) {
              for (const filePath of collectFiles(dir)) {
                const assetName = path.basename(filePath);
                const data = fs.readFileSync(filePath);
                await github.rest.repos.uploadReleaseAsset({
                  owner,
                  repo,
                  release_id: release.data.id,
                  name: assetName,
                  data,
                  headers: {
                    'content-type': contentTypeFor(filePath),
                    'content-length': data.length,
                  },
                });
              }
            }

  notify_discord:
    name: Notify Discord
    runs-on: ubuntu-24.04
    needs:
      - summary
      - publish_opt_build
    if: always() && github.event_name != 'pull_request'

    steps:
      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          SUMMARY_RESULT: ${{ needs.summary.result }}
          PUBLISH_RESULT: ${{ needs.publish_opt_build.result }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          SERVER_URL: ${{ github.server_url }}
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          APP_VERSION: ${{ env.APP_VERSION }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK is not configured, skipping notification."
            exit 0
          fi

          RUN_URL="$SERVER_URL/$REPOSITORY/actions/runs/$RUN_ID"
          RELEASE_URL="$SERVER_URL/$REPOSITORY/releases/tag/opt-build"
          SHORT_SHA="${SHA::7}"
          TIMESTAMP_UTC="$(date -u +"%Y-%m-%d %H:%M UTC")"
          TIMESTAMP_ISO="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

          if [ "$SUMMARY_RESULT" = "success" ]; then
            STATUS="SUCCESS"
            COLOR=5763719
            if [ "$PUBLISH_RESULT" = "success" ]; then
              DOWNLOAD_LABEL="Release"
              DOWNLOAD_URL="$RELEASE_URL"
              DESCRIPTION="The workflow completed successfully and the latest opt build is ready to download."
            else
              DOWNLOAD_LABEL="Artifacts"
              DOWNLOAD_URL="$RUN_URL"
              DESCRIPTION="The workflow completed successfully. The build files are available in this run's artifacts."
            fi
          else
            STATUS="FAILED"
            COLOR=15548997
            DOWNLOAD_LABEL="Workflow Run"
            DOWNLOAD_URL="$RUN_URL"
            DESCRIPTION="The workflow finished with errors. Check the run logs for details."
          fi

          export STATUS COLOR DOWNLOAD_LABEL DOWNLOAD_URL DESCRIPTION TIMESTAMP_UTC TIMESTAMP_ISO

          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          webhook = os.environ["DISCORD_WEBHOOK"]
          repo = os.environ["REPOSITORY"]
          branch = os.environ["REF_NAME"]
          short_sha = os.environ["SHA"][:7]
          run_id = os.environ["RUN_ID"]
          run_number = os.environ["RUN_NUMBER"]
          actor = os.environ["ACTOR"]
          event_name = os.environ["EVENT_NAME"]
          app_version = os.environ["APP_VERSION"]
          run_url = f'{os.environ["SERVER_URL"]}/{repo}/actions/runs/{run_id}'

          payload = {
              "embeds": [
                  {
                      "title": f'Build Workflow {os.environ["STATUS"]}',
                      "description": (
                          f'{os.environ["DESCRIPTION"]}\n\n'
                          f'[{os.environ["DOWNLOAD_LABEL"]}]({os.environ["DOWNLOAD_URL"]})'
                      ),
                      "color": int(os.environ["COLOR"]),
                      "timestamp": os.environ["TIMESTAMP_ISO"],
                      "fields": [
                          {"name": "Repository", "value": repo, "inline": True},
                          {"name": "Branch", "value": branch, "inline": True},
                          {"name": "Commit", "value": f'`{short_sha}`', "inline": True},
                          {"name": "Run", "value": f'#{run_number}', "inline": True},
                          {"name": "Triggered by", "value": actor, "inline": True},
                          {"name": "Event", "value": event_name, "inline": True},
                          {"name": "App Version", "value": f'`{app_version}`', "inline": False},
                          {"name": "Completed At", "value": os.environ["TIMESTAMP_UTC"], "inline": False},
                          {"name": "Workflow Logs", "value": run_url, "inline": False},
                      ],
                  }
              ]
          }

          data = json.dumps(payload).encode("utf-8")
          req = urllib.request.Request(
              webhook,
              data=data,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "GitHub-Actions-Discord-Notifier",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  print(f"Discord webhook response: {resp.status}")
          except urllib.error.HTTPError as err:
              body = err.read().decode("utf-8", errors="replace")
              print(f"Discord webhook HTTP error: {err.code} {err.reason}")
              if body:
                  print(body)
              print("Continuing without failing the workflow.")
              sys.exit(0)
          except Exception as err:
              print(f"Discord webhook unexpected error: {err}")
              print("Continuing without failing the workflow.")
              sys.exit(0)
          PY
